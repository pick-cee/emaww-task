services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
  exporter:
    build:
      context: .
      secrets:
        - build_ca
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis-data:

secrets:
  build_ca:
    file: ${NODE_EXTRA_CA_CERTS:-/dev/null}
